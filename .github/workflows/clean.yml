name: Clean files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git rm -q -r --ignore-unmatch -- $(ls -A | grep -v -E '^(\.git|\.github)$') || true
          git config user.name "cleaner"
          git config user.email "cleaner@users.noreply.github.com"
          git commit -m "Clean files" || echo "nothing to commit"
          git push
